name: People recruiting
env:
  GITHUB_CONTEXT: ${{ toJson(github) }}

on: push

jobs:
  recruiting-report:
    runs-on: ubuntu-latest

    steps:
      - name: The agent introduces themselves
        run: echo "I am Lex Luthor, and the Bad Legion leader"

      - name: Identity report
        run: |
          echo "Identity report"
          echo "==============="
          echo ""
          echo "Key name: ${{ github.actor }}"
          echo "Contexto de Github"
          echo "Repo: ${{ github.repository }}"
          echo "Operation: ${{ github.sha }}"
          printf 'Metadata: %s\n' "$GITHUB_CONTEXT"

      - name: Agent capabilities
        run: |
          echo "Detected capabilities"
          echo "Operative System"
          uname -a
          echo "Skills"
          node --version
          git --version
          python3 --version

      - name: Recognize land
        run: |
          echo "Recognize the land"
          ls /
